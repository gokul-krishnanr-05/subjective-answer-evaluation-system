<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap');

*{
    box-sizing: border-box;
}
:root{
    --first-color: #e7eaf6;
    --second-color: #a2a8d3;
    --third-color: #38598b;
    --fourth-color: #113f67;
    --input-bgcolor: #f2f2f2;
}


body{
    font-family: 'Poppins', sans-serif;
    background-color: var(--first-color);
}

.login-page {
    width: 400px;
    padding: 10% 0 0;
    margin: auto;
}
.form {
    position: relative;
    z-index: 1;
    background: #FFFFFF;
    max-width: 400px;
    margin: 0 auto 100px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.1), 0 5px 5px 0 rgba(0, 0, 0, 0.2);
}
.form input {
    outline: 0;
    background: var(--input-bgcolor);
    width: 100%;
    border: 0;
    margin: 0 0 15px;
    padding: 1rem;
    font-size: 0.9rem;
}
.form select {
    outline: 0;
    background: var(--input-bgcolor);
    width: 100%;
    border: 0;
    margin: 0 0 15px;
    padding: 1rem;
    font-size: 0.9rem;
}
.form button {
    text-transform: uppercase;
    outline: 0;
    background: var(--fourth-color);
    width: 100%;
    border: 0;
    padding: 15px;
    color: #FFFFFF;
    font-size: 1rem;
    -webkit-transition: all 0.3s ease;
    transition: all 0.3s ease;
    cursor: pointer;
}
.form button:hover,.form button:active,.form button:focus {
    background: var(--third-color);
}
.form .message {
    margin: 15px 0 0;
    color: var(--second-color);
    font-size: 0.8rem;
}
.form .message a {
    color: var(--third-color);
    text-decoration: none;
}
.form .register-form {
    display: none;
}

/*Footer*/
#footer{
    position: absolute;
    width: 20rem;
    bottom: 1rem;
    left: calc(50% - 10rem);
}
#footer div p{
    color: var(--third-color);
    font-size: 0.7rem;
    text-align: center;
}
#footer div a{
    color: var(--third-color);
    text-decoration: none;
}
#footer div a span{
    color: var(--fourth-color);
    font-weight: 600;
}
  </style>
  <body>
<div class="container">
  <div class="login-page">
    <div class="form">
      <form class="register-form" method="post" action="register.php">
        <select name="type" type="select">
          <option value="" selected>Select the type</option>
          <option value="1">Teacher</option>
          <option value="2">Student</option>
        </select>
        <input type="text" placeholder="Name" name="name">
        <input type="email" placeholder="Email" name="email">
        <input type="password" placeholder="Password" name="password">
        
        <!-- <select name="type" id="">
            <option value="" selected>Choose user</option>
            <option value="0">Teacher</option>
            <option value="1">Student</option>
        </select> -->
        <button type="submit" name="submit">Register</button>
        <p class="message">Already registered? <a href="#">Sign In</a></p>
      </form>
      <form class="login-form" action="login.php" method="post"> 
        <input type="email" placeholder="email" name="email">
        <input type="password" placeholder="Password" name="password">
        <button type="submit" name="submit">Login</button>
        <p class="message">Not registered? <a href="#">Create an Account</a></p>
      </form>
    </div>
  </div>
</div>

<!--Footer-->
<footer id="footer">
  <div class="createdBy">
    <!-- <p>
      Coded by <a href="https://urukm.com"><span>URUKM</span></a>
    </p> -->
  </div>

</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    $(".message a").click(function () {
  $(".register-form").toggle("slow");
});
$(".message a").click(function () {
  $(".login-form").toggle("slow");
});

  </script>
</body>
</html>
